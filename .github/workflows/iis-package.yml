name: Test IIS package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iis:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      IIS_PACKAGE_ROOT: 'C:\Go Router IIS Test\go-router'
      RUSTFLAGS: -C target-feature=+crt-static
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.89 --profile minimal
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test and build Windows executable with static C runtime
        run: |
          cargo +1.89 test --locked
          if ($LASTEXITCODE) { throw 'Windows Rust tests failed' }
          cargo +1.89 build --locked --release
          if ($LASTEXITCODE) { throw 'Windows build failed' }
      - name: Build private IIS ZIP and extract it like the recipient
        run: |
          python scripts/package-iis.py --binary target/release/go-router.exe --output package/go-router-iis-windows-x64.zip --origin https://localhost:8443
          if ($LASTEXITCODE) { throw 'Packaging failed' }
          Expand-Archive package/go-router-iis-windows-x64.zip -DestinationPath 'C:\Go Router IIS Test'
      - name: Enable IIS and install Microsoft hosting module
        run: |
          Install-WindowsFeature Web-Server,Web-Mgmt-Tools -IncludeManagementTools
          $metadata = Invoke-RestMethod 'https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json'
          $installer = $metadata.releases[0].'aspnetcore-runtime'.files | Where-Object name -eq dotnet-hosting-win.exe | Select-Object -First 1
          if ($installer.url -notmatch '^https://builds\.dotnet\.microsoft\.com/') { throw 'Unexpected installer source' }
          Invoke-WebRequest -UseBasicParsing $installer.url -OutFile "$env:RUNNER_TEMP\hosting.exe"
          if ((Get-FileHash "$env:RUNNER_TEMP\hosting.exe" -Algorithm SHA512).Hash -ne $installer.hash) { throw 'Microsoft installer checksum mismatch' }
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP\hosting.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'Invalid Microsoft installer signature' }
          $result = Start-Process "$env:RUNNER_TEMP\hosting.exe" -ArgumentList '/install','/quiet','/norestart','OPT_NO_RUNTIME=1','OPT_NO_SHAREDFX=1','OPT_NO_X86=1' -Wait -PassThru
          if ($result.ExitCode -notin @(0,3010)) { throw "Hosting bundle exited $($result.ExitCode)" }
          Restart-Service W3SVC -Force
      - name: Create IIS site with documented pool and permissions
        run: tests/iis-server.ps1
      - name: Test the ZIP through HTTPS and IIS
        run: |
          python tests/iis_smoke.py
          if ($LASTEXITCODE) { throw 'IIS integration checks failed' }
      - name: Diagnostics on failure
        if: failure()
        run: |
          Get-ChildItem "$env:IIS_PACKAGE_ROOT\data\logs" -Filter '*.log' -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 35 }
          Get-WinEvent -FilterHashtable @{LogName='Application';StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue | Where-Object ProviderName -Match 'IIS|ASP' | Select-Object -First 8 | Format-List TimeCreated,ProviderName,Message
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iis-package-tested
          path: package/go-router-iis-windows-x64.zip*
          retention-days: 3

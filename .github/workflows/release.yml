name: Release binary
# Builds release packages on every v* tag and publishes them with build provenance.
# Run manually (workflow_dispatch) to test the builds without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
# Build jobs get a read-only token. Only the final publish job can write.
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.88 --profile minimal
      - name: Test and build
        env:
          # Link the C runtime statically: no VCRUNTIME140.dll needed or searched for.
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo +1.88 test --locked
          cargo +1.88 build --locked --release
      - name: Package Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package/go-router -Force | Out-Null
          Copy-Item target/release/go-router.exe package/go-router/
          Copy-Item -Recurse config,deploy,scripts,docs,examples package/go-router/
          Copy-Item README.md,LICENSE,SECURITY.md,.env.example package/go-router/
          Compress-Archive -Path package/go-router -DestinationPath go-router-windows-x86_64.zip
          $hash = (Get-FileHash go-router-windows-x86_64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content go-router-windows-x86_64.zip.sha256 "$hash  go-router-windows-x86_64.zip" -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: go-router-windows-x86_64.zip*
          if-no-files-found: error
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build the Debian 12 compatible release image
        run: docker build -t go-router:release .
      - name: Extract release binary
        run: |
          id=$(docker create go-router:release)
          mkdir -p target/release
          docker cp "$id:/app/go-router" target/release/go-router
          docker rm "$id"
      - name: Package
        run: |
          mkdir go-router
          cp target/release/go-router go-router/
          cp -r config deploy scripts docs examples README.md LICENSE SECURITY.md .env.example go-router/
          # Root-owned entries: extracting with sudo never yields files owned by a local user.
          tar --owner=0 --group=0 --numeric-owner -czf go-router-linux-${{ matrix.arch }}.tar.gz go-router
          sha256sum go-router-linux-${{ matrix.arch }}.tar.gz > go-router-linux-${{ matrix.arch }}.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: go-router-linux-*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Record build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "Packages for Windows (x86_64) and Linux (x86_64, aarch64). Verify a download with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
